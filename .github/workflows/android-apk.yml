name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Android project
        working-directory: portable_ai_flutter
        run: flutter create . --platforms=android --project-name portable_ai

      - name: Get dependencies
        working-directory: portable_ai_flutter
        run: flutter pub get

      - name: Analyze
        working-directory: portable_ai_flutter
        run: flutter analyze

      - name: Build APK
        working-directory: portable_ai_flutter
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: portable-ai-apk
          path: portable_ai_flutter/build/app/outputs/flutter-apk/app-release.apk
